name: Build RoboPi Addon Deb Package

on:
  push:

jobs:
  build:
    runs-on: [self-hosted, Linux, ARM64, "24.04"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Tag vs changelog version check
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        TAG_VERSION="${GITHUB_REF#refs/tags/v}"
        CHANGELOG_VERSION=$(head -1 debian/changelog | grep -oP '\((.*?)\)' | tr -d '()' | cut -d'-' -f1)

        echo "Tag version:       $TAG_VERSION"
        echo "Changelog version: $CHANGELOG_VERSION"

        if [ "$TAG_VERSION" != "$CHANGELOG_VERSION" ]; then
          echo "::error::Version mismatch! tag=v$TAG_VERSION, changelog=$CHANGELOG_VERSION"
          exit 1
        fi

        echo "✅ Tag matches changelog: v$TAG_VERSION"

    - name: Install build dependencies
      run: sudo apt-get update && sudo apt-get install -y build-essential debhelper unzip kmod binutils

    - name: Build Debian package
      run: |
        dpkg-buildpackage -us -uc -b

        DEBIAN_VERSION=$(dpkg-parsechangelog -S Version)
        VERSION=${DEBIAN_VERSION%%-*}
        mv "../robopi-addon_${DEBIAN_VERSION}_arm64.deb" .

        echo "PKG_VERSION=$VERSION" >> $GITHUB_ENV
        ls -l robopi-addon_*_arm64.deb

    - name: Verify package kernel binding
      run: |
        TARGET_KERNEL_RELEASE=6.18.50-current-rockchip64
        DEB=$(ls robopi-addon_*_arm64.deb | head -1)
        dpkg-deb -c "$DEB" | grep -F "/lib/modules/${TARGET_KERNEL_RELEASE}/" || {
          echo "::error::Package missing modules for ${TARGET_KERNEL_RELEASE}"
          exit 1
        }

        tmp=$(mktemp -d)
        dpkg-deb -x "$DEB" "$tmp"
        dpkg-deb -e "$DEB" "$tmp/DEBIAN"
        grep -F "target=${TARGET_KERNEL_RELEASE}" "$tmp/opt/roboparty/bin/robopi-usb-wifi-init" || {
          echo "::error::init script does not target ${TARGET_KERNEL_RELEASE}"
          exit 1
        }
        grep -F "ConditionPathExists=/lib/modules/${TARGET_KERNEL_RELEASE}/" \
          "$tmp/lib/systemd/system/robopi-usb-wifi.service" || {
          echo "::error::service ConditionPathExists mismatch"
          exit 1
        }
        for script in postinst prerm postrm; do
          grep -F "TARGET_KERNEL_RELEASE=${TARGET_KERNEL_RELEASE}" "$tmp/DEBIAN/$script" || {
            echo "::error::$script does not target ${TARGET_KERNEL_RELEASE}"
            exit 1
          }
        done
        rm -rf "$tmp"
        echo "OK: $DEB bound to ${TARGET_KERNEL_RELEASE}"

    - name: Upload Debian package
      uses: actions/upload-artifact@v4
      with:
        name: robopi-addon-v${{ env.PKG_VERSION }}-arm64
        path: "robopi-addon_*_arm64.deb"

    - name: Upload to GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: "robopi-addon_*_arm64.deb"
